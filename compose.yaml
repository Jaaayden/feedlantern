name: feedlantern
services:
  feedlantern:
    image: ghcr.io/jaaayden/feedlantern:${FEEDLANTERN_VERSION:-0.2.0}
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    shm_size: 1gb
    security_opt:
      - seccomp=./deploy/seccomp_profile.json
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:4321}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:-}
      DNS_OVER_HTTPS: ${DNS_OVER_HTTPS:-false}
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/auth/status',{headers:{host:new URL(process.env.PUBLIC_ORIGIN).host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  data:
