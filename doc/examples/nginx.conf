# Replace feeds.example.com and certificate paths before enabling.
server {
    listen 80;
    server_name feeds.example.com;
    access_log off;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name feeds.example.com;
    ssl_certificate /etc/letsencrypt/live/feeds.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feeds.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # RSS paths contain bearer secrets. Do not log request URIs.
    access_log off;
    error_log /dev/null;
    client_max_body_size 96m;
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
