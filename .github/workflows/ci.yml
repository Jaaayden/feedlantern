name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Ubuntu 24.04's AppArmor policy blocks the downloaded Chromium user
    # namespace sandbox. Keep sandboxing enabled on the supported 22.04 VM.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check and build
        run: pnpm build
      - name: Unit and integration tests
        run: pnpm test
      - name: Browser acceptance tests
        run: pnpm test:e2e
      - name: Preserve browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-test-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  containers:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Permit sandbox namespaces on ephemeral ARM runner
        if: matrix.arch == 'arm64'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build native image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t feedlantern:test .
      - name: Validate Compose and container
        run: |
          docker compose config --quiet
          docker run --rm --init --shm-size=1g --security-opt seccomp=seccomp_profile.json feedlantern:test pnpm exec tsx scripts/container-smoke.ts
      - name: Validate documented Compose deployment
        run: sh scripts/test-compose.sh
      - name: Validate Nginx HTTPS deployment
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx openssl
          sh scripts/test-proxy.sh
      - name: Save verified image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: docker save feedlantern:test | gzip > image-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 2

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [verify, containers]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: image-*
          merge-multiple: true
      - name: Publish verified images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            version="sha-$GITHUB_SHA"
          else
            version="${RELEASE_TAG#v}"
            test "$(node -p 'require("./package.json").version')" = "$version"
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            gunzip -c "image-$arch.tar.gz" | docker load
            docker tag feedlantern:test "ghcr.io/jaaayden/feedlantern:$version-$arch"
            docker push "ghcr.io/jaaayden/feedlantern:$version-$arch"
          done
          docker manifest create "ghcr.io/jaaayden/feedlantern:$version" "ghcr.io/jaaayden/feedlantern:$version-amd64" "ghcr.io/jaaayden/feedlantern:$version-arm64"
          docker manifest push "ghcr.io/jaaayden/feedlantern:$version"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            # A manually rerun old workflow must not roll latest backwards.
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$current_sha" = "$GITHUB_SHA" ]; then
              docker manifest create ghcr.io/jaaayden/feedlantern:latest "ghcr.io/jaaayden/feedlantern:$version-amd64" "ghcr.io/jaaayden/feedlantern:$version-arm64"
              docker manifest push ghcr.io/jaaayden/feedlantern:latest
            else
              echo 'main has advanced; leaving latest unchanged'
            fi
          fi
      - name: Publish versioned release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          tar -czf deployment.tar.gz docker-compose.yml seccomp_profile.json doc
          sha256sum deployment.tar.gz docker-compose.yml seccomp_profile.json > SHA256SUMS
          gh release create "$RELEASE_TAG" deployment.tar.gz docker-compose.yml seccomp_profile.json SHA256SUMS --verify-tag --generate-notes
